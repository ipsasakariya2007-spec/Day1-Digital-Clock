<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#c084fc,#818cf8);
    }

    .container{
        text-align:center;
        background:rgba(255,255,255,0.15);
        padding:40px;
        border-radius:25px;
        color:white;
        width:450px;
        border: 2px solid rgba(115, 44, 115, 0.754);
    }

    h1{
        margin-bottom:20px;
        letter-spacing:2px;
    }

    #date{
        font-size:1.1rem;
        margin-bottom:15px;
    }

    #clock{
        font-size:3.5rem;
        font-weight:bold;
        margin-bottom:15px;
    }

    #greeting{
        font-size:20PX;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Digital Clock</h1>

    <div id="date"></div>

    <div id="clock">00:00:00</div>

    <div id="greeting"></div>

</div>

<script>
    function updateClock(){

    let now = new Date();

    let hr = now.getHours();
    let min = now.getMinutes();
    let sec = now.getSeconds();

    document.getElementById("clock").innerHTML =
    hr + ":" + min + ":" + sec;

}

updateClock();

setInterval(updateClock,1000);
</script>

</body>
</html>
